<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>名單總系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first — "today" action list first, analytics on its own tab, fixed bottom tab bar, details open as a bottom sheet */
:root{
  --bg:#eef2f1; --surface:#ffffff; --sunk:#e4eae8; --ink:#16282b; --muted:#5b6d6e; --line:#d3dcda;
  --accent:#0f6b63; --accent-soft:#d6ece8; --recruit:#6449a8; --recruit-soft:#e8e2f5;
  --warn:#a85c14; --warn-soft:#f7e8d6; --bad:#b0352e; --bad-soft:#f6dedb; --good:#2c7a39;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1616; --surface:#152120; --sunk:#1b2a29; --ink:#e3edeb; --muted:#93a7a5; --line:#273a38;
  --accent:#4db5aa; --accent-soft:#163633; --recruit:#a891e8; --recruit-soft:#272043;
  --warn:#e09a54; --warn-soft:#3a2a17; --bad:#ec6c62; --bad-soft:#3d1d1a; --good:#6cc27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1616; --surface:#152120; --sunk:#1b2a29; --ink:#e3edeb; --muted:#93a7a5; --line:#273a38;
  --accent:#4db5aa; --accent-soft:#163633; --recruit:#a891e8; --recruit-soft:#272043;
  --warn:#e09a54; --warn-soft:#3a2a17; --bad:#ec6c62; --bad-soft:#3d1d1a; --good:#6cc27a; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
h2{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--sunk);border-radius:8px;padding:10px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.kpi .g{font-size:12px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.done{background:var(--good)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.btn.big{padding:11px 16px;font-size:16px;justify-content:center}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--accent)}
:is(.btn,.chip,.row-main,.tab,.pcard,.icon-btn,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 2px;cursor:pointer;background:none;border:0;text-align:left}
.row-main:hover .n{color:var(--accent)}
.row .n{font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.row .m{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;flex-shrink:0}
.tag{display:inline-block;font-size:11.5px;line-height:1;padding:4px 6px;border-radius:5px;font-weight:500;white-space:nowrap}
.t-c{background:var(--accent-soft);color:var(--accent)}
.t-r{background:var(--recruit-soft);color:var(--recruit)}
.t-ex{background:var(--warn-soft);color:var(--warn)}
.t-cold{background:var(--sunk);color:var(--muted)}
.lv{font-family:var(--f-num);font-size:11px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--muted);color:var(--muted);flex-shrink:0}
.lv.A{border-color:var(--accent);color:var(--accent)}
.due{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.due.over{color:var(--bad);font-weight:500}.due.today{color:var(--warn);font-weight:500}
.pill{font-size:11.5px;padding:2px 7px;border-radius:999px;font-weight:500}
.pill.over{background:var(--bad-soft);color:var(--bad)}.pill.today{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.date-h{font-family:var(--f-display);font-size:20px}
/* onboarding */
.steps-ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.steps-ol b{color:var(--accent)}
/* funnel */
.fun{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:5.2em 1fr 3.4em;align-items:center;gap:8px;font-size:13px}
.fr .bar{height:18px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fr .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:2px}
.fun.r .bar i{background:var(--recruit)}
.fr .c{text-align:right}
.cv{grid-column:2/4;font-size:11.5px;color:var(--muted);margin:-3px 0 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.note{font-size:12.5px;color:var(--muted)}
/* toolbar */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* pipeline */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.col{flex:0 0 200px;background:var(--sunk);border-radius:var(--r);padding:8px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.col h3{margin:2px 4px 0;font-size:13px;display:flex;justify-content:space-between;font-weight:700}
.col .hint{margin:0 4px 4px;font-size:11.5px;color:var(--muted)}
.col.paused{opacity:.75}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.pcard .m{font-size:12px;color:var(--muted)}
/* stage tracker */
.track{display:flex;flex-direction:column;gap:8px}
.track + .track{border-top:1px solid var(--line);padding-top:12px}
.track-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.dots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.dots li{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-align:center;line-height:1.25;position:relative}
.dots li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1}
.dots li::after{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line)}
.dots li:first-child::after{display:none}
.dots li.past::before{background:var(--accent);border-color:var(--accent)}
.dots li.past::after,.dots li.now::after{background:var(--accent)}
.dots li.now::before{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.dots li.now{color:var(--ink);font-weight:700}
.track.r .dots li.past::before{background:var(--recruit);border-color:var(--recruit)}
.track.r .dots li.past::after,.track.r .dots li.now::after{background:var(--recruit)}
.track.r .dots li.now::before{border-color:var(--recruit);background:var(--recruit-soft);box-shadow:0 0 0 3px var(--recruit-soft)}
.track-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.track-a select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 8px;font-size:13px;color:var(--muted)}
.next-box{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.next-box .l{font-size:12px;color:var(--accent);font-weight:500}
.contact-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact-line .v{font-family:var(--f-num);user-select:all;overflow-wrap:anywhere}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{border:0;background:none;padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--accent);font-weight:500}
.tab.add{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;font-family:var(--f-num);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,20,.45)}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:14px 14px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:14px;max-height:88%}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.ph h2{font-size:21px}
.dl{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:15px;color:var(--ink);width:100%}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.fg{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;color:var(--ink);background:var(--surface);cursor:pointer}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.checks.big label{padding:8px 14px;font-size:15px}
.checks input{accent-color:var(--accent)}
.sw{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.sw input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.more summary{cursor:pointer;padding:10px 12px;font-weight:500;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
details.more .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.adv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.log{display:flex;flex-direction:column;font-size:14px}
.log div{display:grid;grid-template-columns:5.6em 3.6em 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.log .t{color:var(--muted);font-size:12.5px}
.err{color:var(--bad);font-size:13px;margin:0}
.help h3{font-size:15px;margin:0 0 4px}
.help p,.help ul{margin:0;font-size:14px}
.help ul{padding-left:1.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div><h1>名單總系統</h1><div class="sub" id="subline">保經業務 · 客戶與增員名單</div></div>
    <button class="icon-btn" data-act="help" aria-label="使用說明" title="使用說明">?</button>
  </header>
  <div id="view"><div class="card empty">正在載入名單…</div></div>
</div>

<nav class="tabs" aria-label="主選單"><div class="tabs-in">
  <button class="tab" data-v="today" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>今天<span class="badge" id="badge" hidden></span></button>
  <button class="tab" data-v="list"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5h6M16 9h6M18 13h4"/></svg>名單</button>
  <button class="tab" data-v="pipe"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>流程</button>
  <button class="tab" data-v="data"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>數據</button>
  <button class="tab add" data-v="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新增</button>
</div></nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<script>
/* ---------- constants ---------- */
const CLIENT_STAGES=['未接觸','已約訪','已面談','需求分析','建議書','成交','暫緩'];
const RECRUIT_STAGES=['未接觸','已接觸','事業說明','考照中','已報到','輔導期','暫緩'];
const HINTS={
  client:{'未接觸':'打電話或傳訊息，約時間見面','已約訪':'見面聊近況，了解家庭與需求','已面談':'整理需求，做需求分析','需求分析':'準備建議書','建議書':'說明建議書，促成簽約','成交':'送件、售後服務，請他轉介紹','暫緩':'過一段時間再問候'},
  recruit:{'未接觸':'先聊近況，了解他對工作的想法','已接觸':'邀請參加事業說明','事業說明':'鼓勵報名考照','考照中':'陪讀、確認考試日期','已報到':'安排新人訓練','輔導期':'定期陪同，追蹤進度','暫緩':'過一段時間再問候'}};
const SOURCES=['緣故','轉介紹','陌生開發','社群','活動','其他'];
const RELATIONS=['親戚','同學','同事','朋友','鄰居','客戶介紹','其他'];
const NEEDS=['醫療','壽險','意外','長照','儲蓄','退休','子女教育','房貸保障','外幣資產','資產傳承'];
const AGES=['20以下','20-29','30-39','40-49','50-59','60以上'];
const LOG_TYPES=['電話','訊息','見面','其他'];
const STAGE_KPI={client:{'已約訪':'約訪','已面談':'面談','成交':'成交'},recruit:{'事業說明':'事業說明','已報到':'報到'}};
const DEFAULT_RATES={r1:.3,r2:.7,r3:.25};
const COLD_DAYS=30;
const DATE_CHIPS=[['明天',1],['3 天後',3],['1 週後',7],['2 週後',14],['1 個月後',30]];
const WEEKDAYS=['日','一','二','三','四','五','六'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const monthStart=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'};
const short=s=>s?s.slice(5).replace('-','/'):'';
const newId=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const pct=x=>isFinite(x)?Math.round(x*100)+'%':'—';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

const S={contacts:[],settings:{weeklyNew:10,weeklyAppt:5,weeklyMeet:3,monthlyDeals:4},
  view:'today',pipe:'client',q:'',filter:'all',status:'loading',db:null,dl:null,
  sheet:null,openId:null,returnTo:null,rendered:null,mode:'local'};

/* ---------- data shape ---------- */
function normalize(c){
  c.needs=Array.isArray(c.needs)?c.needs:[];c.log=Array.isArray(c.log)?c.log:[];c.stageDates=c.stageDates||{};
  if(c.clientStage==='名單'||!c.clientStage)c.clientStage='未接觸';
  if(c.recruitStage==='名單'||!c.recruitStage)c.recruitStage='未接觸';
  if(c.contact&&!c.phone&&!c.line){if(/\d{6,}/.test(c.contact.replace(/[\s-]/g,'')))c.phone=c.contact;else c.contactOther=c.contact;delete c.contact}
  return c;
}
function kindInfo(k){return k==='client'
  ?{k,stages:CLIENT_STAGES,flag:'isClient',field:'clientStage',max:'clientMax',label:'客戶',done:'成交'}
  :{k,stages:RECRUIT_STAGES,flag:'isRecruit',field:'recruitStage',max:'recruitMax',label:'增員',done:'輔導期'}}
function kindsOf(c){return ['client','recruit'].filter(k=>c[kindInfo(k).flag])}
function lastContact(c){let m='';(c.log||[]).forEach(l=>{if(l.k!=='建立'&&l.d>m)m=l.d});return m}
function daysSilent(c){const lc=lastContact(c)||(c.createdAt||'').slice(0,10);return lc?daysBetween(lc,today()):0}
function isActive(c){return kindsOf(c).some(k=>{const K=kindInfo(k),s=c[K.field];return s!=='暫緩'&&s!==K.done&&!(k==='client'&&s==='成交')})}
function isCold(c){return isActive(c)&&!c.nextDate&&daysSilent(c)>=COLD_DAYS}
function nextStageOf(c,k){const K=kindInfo(k),cur=c[K.field];
  if(cur==='暫緩')return K.stages[Math.max(0,c[K.max]||0)];
  const i=K.stages.indexOf(cur);return i>=0&&i<K.stages.length-2?K.stages[i+1]:null}
function setStage(c,k,val){
  const K=kindInfo(k),old=c[K.field];if(old===val)return false;
  c[K.field]=val;c.stageDates=c.stageDates||{};c.stageDates[val]=today();
  if(val!=='暫緩')c[K.max]=Math.max(c[K.max]??0,K.stages.indexOf(val));
  c.log.push({d:today(),k:STAGE_KPI[k][val]||'階段',x:`${K.label}：${old} → ${val}`});
  return true;
}
function trimLog(c){c.log=c.log.slice(-150)}

/* ---------- storage ---------- */
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn);queues[key]=p;return p}
const LS_KEY='prospect-system-local';
function lsLoad(){try{const r=JSON.parse(lsGet(LS_KEY)||'null');if(r){S.contacts=(r.contacts||[]).map(normalize);Object.assign(S.settings,r.settings||{})}}catch(e){}}
function lsSave(){lsSet(LS_KEY,JSON.stringify({contacts:S.contacts,settings:S.settings}))}
async function saveContact(c){
  c.updatedAt=new Date().toISOString();trimLog(c);
  if(S.mode==='db'){
    const body=clone(c);delete body.id;
    const i=S.contacts.findIndex(x=>x.id===c.id);if(i>=0)S.contacts[i]=c;else S.contacts.push(c);
    try{await enqueue(c.id,()=>S.db.collection('contacts').doc(c.id).set(body))}
    catch(e){toast(e&&e.code==='quota_exceeded'?'資料庫已滿，請先刪除一些名單':'儲存失敗，請再試一次');throw e}
  }else{const i=S.contacts.findIndex(x=>x.id===c.id);if(i>=0)S.contacts[i]=c;else S.contacts.push(c);lsSave();render()}
}
async function deleteContact(id){
  if(S.mode==='db'){try{await enqueue(id,()=>S.db.collection('contacts').doc(id).delete())}catch(e){toast('刪除失敗，請再試一次');throw e}}
  else{S.contacts=S.contacts.filter(x=>x.id!==id);lsSave();render()}
}
async function saveSettings(){
  if(S.mode==='db'){try{await enqueue('settings',()=>S.db.doc('settings/goals').set(clone(S.settings)))}catch(e){toast('目標儲存失敗')}}
  else lsSave();
  render();
}

/* ---------- derived numbers ---------- */
function funnel(k){
  const K=kindInfo(k),list=S.contacts.filter(c=>c[K.flag]);
  const main=K.stages.slice(0,-1);
  const reached=main.map((_,i)=>list.filter(c=>(c[K.max]??0)>=i).length);
  return {main,reached,paused:list.filter(c=>c[K.field]==='暫緩').length,total:list.length};
}
function weekStats(){
  const ws=weekStart(),logs=[];S.contacts.forEach(c=>(c.log||[]).forEach(l=>{if(l.d>=ws)logs.push(l)}));
  const cnt=t=>logs.filter(l=>l.k===t).length;
  return {newC:S.contacts.filter(c=>(c.createdAt||'').slice(0,10)>=ws).length,appt:cnt('約訪'),meet:cnt('面談'),
    touch:logs.filter(l=>LOG_TYPES.includes(l.k)).length,recruitTalk:cnt('事業說明')};
}
function monthDeals(){
  const ms=monthStart(),deals=S.contacts.filter(c=>c.clientStage==='成交'&&(c.stageDates?.['成交']||'')>=ms);
  return {n:deals.length,prem:deals.reduce((s,c)=>s+(Number(c.premium)||0),0)};
}
function rates(){
  const R=funnel('client').reached;
  const r=(a,b,def)=>R[b]>=5?{v:R[a]/R[b],real:true}:{v:def,real:false};
  return {r1:r(1,0,DEFAULT_RATES.r1),r2:r(2,1,DEFAULT_RATES.r2),r3:r(5,2,DEFAULT_RATES.r3)};
}
function dueClass(d){if(!d)return'';const t=today();return d<t?'over':d===t?'today':''}
function dueLabel(d){if(!d)return'';const n=daysBetween(today(),d);
  return n<0?`逾期 ${-n} 天`:n===0?'今天':n===1?'明天':`${short(d)}`}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab[data-v]').forEach(b=>{if(b.dataset.v===S.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const t=today(),dueN=S.contacts.filter(c=>c.nextDate&&c.nextDate<=t).length,bd=$('#badge');
  bd.hidden=!dueN;bd.textContent=dueN>99?'99+':dueN;
  $('#subline').textContent=`保經業務 · ${S.contacts.length} 位名單`+(S.mode==='local'?' · 資料存在這台裝置':'');
  if(S.view==='list'&&S.rendered==='list'&&$('#q')){renderResults();refreshSheet();return}
  S.rendered=S.view;
  const v=$('#view');
  if(S.status==='loading'){v.innerHTML='<div class="card empty">正在載入名單…</div>';return}
  let h='';
  if(S.status==='slow')h+='<div class="banner" style="margin-bottom:12px">資料庫暫時連不上，顯示的內容可能不是最新的。</div>';
  if(S.status==='error')h+='<div class="banner" style="margin-bottom:12px">資料庫連線中斷，請重新開啟頁面。</div>';
  h+={today:todayHTML,list:listHTML,pipe:pipeHTML,data:dataHTML}[S.view]();
  v.innerHTML=h;
  if(S.view==='list')renderResults();
  refreshSheet();
}

function rowHTML(c,opt={}){
  const dc=dueClass(c.nextDate),silent=daysSilent(c);
  const meta=c.nextAction?c.nextAction:(opt.cold?`已經 ${silent} 天沒聯絡`:'還沒排下一步');
  return `<div class="row"><button class="row-main" data-open="${esc(c.id)}">
    <span class="n"><span class="lv ${esc(c.level)}" title="熟悉度 ${esc(c.level)}">${esc(c.level||'–')}</span>${esc(c.name)}${c.isClient?`<span class="tag t-c">客戶·${esc(c.clientStage)}</span>`:''}${c.isRecruit?`<span class="tag t-r">增員·${esc(c.recruitStage)}</span>`:''}${c.example?'<span class="tag t-ex">範例</span>':''}</span>
    <span class="m">${esc(meta)}</span></button>
    <span class="row-side">${c.nextDate?`<span class="due ${dc}">${dueLabel(c.nextDate)}</span>`:''}${opt.follow?`<button class="btn sm pri" data-follow="${esc(c.id)}">完成</button>`:''}</span></div>`;
}
function banners(){
  let h='';
  if(S.contacts.some(c=>c.example))h+=`<div class="banner"><span>標示「範例」的是示範名單，熟悉操作後可以一鍵清除。</span><button class="btn sm" data-act="clear-ex">清除範例</button></div>`;
  if(S.mode==='local'){
    const real=S.contacts.filter(c=>!c.example).length,lb=lsGet(LS_KEY+'-backup');
    const age=lb?daysBetween(lb,today()):null;
    if(real>=3&&(age===null||age>=14))h+=`<div class="banner"><span>${age===null?'你還沒備份過名單。':`已經 ${age} 天沒備份了。`}資料只存在這台裝置，建議下載一份備份。</span><button class="btn sm" data-act="backup">下載備份</button></div>`;
  }
  return h;
}
function todayHTML(){
  const t=today(),d=new Date(),wk=addDays(t,7);
  let h=`<div class="stack">${banners()}`;
  if(!lsGet(LS_KEY+'-onboarded'))h+=`<section class="card stack" style="gap:10px"><h2>三步驟開始使用</h2>
    <ol class="steps-ol"><li>按下方 <b>新增</b>，把想得到的人都列進來，只填姓名也可以。</li>
    <li>每天打開 <b>今天</b>，聯絡完一位就按 <b>完成</b>，記下聊了什麼、排好下一次。</li>
    <li>每週看一次 <b>數據</b>，檢查活動量有沒有達標。</li></ol>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="add">新增第一位名單</button><button class="btn" data-act="onboarded">我知道了</button><button class="btn ghost" data-act="help">看完整說明</button></div></section>`;
  if(!S.contacts.length)return h+`<section class="card"><p class="empty" style="margin:0">還沒有名單。按下方「新增」開始。</p></section></div>`;
  const now=S.contacts.filter(c=>c.nextDate&&c.nextDate<=t).sort((a,b)=>a.nextDate.localeCompare(b.nextDate)||(a.level||'Z').localeCompare(b.level||'Z'));
  const soon=S.contacts.filter(c=>c.nextDate&&c.nextDate>t&&c.nextDate<=wk).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  const cold=S.contacts.filter(isCold).sort((a,b)=>(a.level||'Z').localeCompare(b.level||'Z')||daysSilent(b)-daysSilent(a));
  const w=weekStats(),g=S.settings;
  h+=`<section class="card"><div class="card-h"><div><div class="sub">${d.getMonth()+1} 月 ${d.getDate()} 日 星期${WEEKDAYS[d.getDay()]}</div><h2 class="date-h">今天要聯絡 <span class="num">${now.length}</span> 位</h2></div></div>
    ${now.length?`<div class="rows">${now.map(c=>rowHTML(c,{follow:true})).join('')}</div><p class="note" style="margin:8px 0 0">聯絡完按「完成」，記錄這次聊了什麼，順便排好下一次。</p>`
      :`<p class="empty" style="margin:0">今天沒有排定要聯絡的人。${cold.length?'可以從下面「好久沒聯絡」挑幾位問候一下。':'可以到「名單」挑幾位 A 級名單約時間。'}</p>`}</section>`;
  h+=`<section class="card"><div class="card-h"><h2>接下來 7 天</h2><span class="sub num">${soon.length} 位</span></div>
    ${soon.length?`<div class="rows">${soon.slice(0,10).map(c=>rowHTML(c)).join('')}</div>`:'<p class="empty" style="margin:0">接下來一週沒有排定的跟進。</p>'}</section>`;
  if(cold.length)h+=`<section class="card"><div class="card-h"><h2>好久沒聯絡</h2><span class="sub">超過 ${COLD_DAYS} 天，也沒排下一步</span></div>
    <div class="rows">${cold.slice(0,5).map(c=>rowHTML(c,{follow:true,cold:true})).join('')}</div>
    ${cold.length>5?`<button class="btn ghost sm" data-goto-filter="cold">看全部 ${cold.length} 位</button>`:''}</section>`;
  const pc=(v,goal)=>`<span class="num" style="color:${v>=goal&&goal?'var(--good)':'inherit'}">${v}/${goal}</span>`;
  h+=`<section class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <span>本週 新增 ${pc(w.newC,g.weeklyNew)} · 約訪 ${pc(w.appt,g.weeklyAppt)} · 面談 ${pc(w.meet,g.weeklyMeet)}</span>
    <button class="btn sm" data-v="data">看數據</button></section>`;
  return h+'</div>';
}

function listHTML(){
  const f=[['all','全部'],['client','客戶'],['recruit','增員'],['over','逾期'],['cold','好久沒聯絡'],['A','A 級'],['nonext','沒排下一步'],['paused','暫緩']];
  return `<div class="toolbar"><input id="q" class="search" type="search" placeholder="搜尋姓名、職業、需求、備註…" value="${esc(S.q)}" aria-label="搜尋名單">
  <div class="chips">${f.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div></div>
  <div class="sub" id="count" style="margin:0 2px 6px"></div>
  <div class="card" style="padding:2px 12px"><div class="rows" id="results"></div></div>`;
}
function renderResults(){
  const q=S.q.trim().toLowerCase(),t=today();
  let l=S.contacts.filter(c=>!q||[c.name,c.occupation,c.notes,c.relation,c.referrer,c.family,c.phone,c.line,(c.needs||[]).join(' ')].join(' ').toLowerCase().includes(q));
  const F={client:c=>c.isClient,recruit:c=>c.isRecruit,over:c=>c.nextDate&&c.nextDate<t,cold:isCold,A:c=>c.level==='A',nonext:c=>!c.nextDate&&isActive(c),paused:c=>c.clientStage==='暫緩'||c.recruitStage==='暫緩'}[S.filter];
  if(F)l=l.filter(F);
  l.sort((a,b)=>(a.nextDate||'9999').localeCompare(b.nextDate||'9999')||(a.level||'Z').localeCompare(b.level||'Z'));
  document.querySelectorAll('.chip[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===S.filter));
  $('#count').textContent=`共 ${l.length} 位`;
  $('#results').innerHTML=l.length?l.map(c=>rowHTML(c,{cold:S.filter==='cold'})).join(''):`<div class="empty">${S.contacts.length?'沒有符合條件的名單。':'還沒有名單，按下方「新增」開始。'}</div>`;
}

function pipeHTML(){
  const K=kindInfo(S.pipe),list=S.contacts.filter(c=>c[K.flag]);
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    <div class="seg" role="group" aria-label="流程類型"><button data-pipe="client" aria-pressed="${S.pipe==='client'}">客戶流程</button><button data-pipe="recruit" aria-pressed="${S.pipe==='recruit'}">增員流程</button></div>
    <span class="sub">左右滑動看各階段，點名字可推進階段</span></div>
  <div class="board">${K.stages.map(s=>{const cs=list.filter(c=>c[K.field]===s);
    return `<div class="col ${s==='暫緩'?'paused':''}"><h3><span>${s}</span><span class="num">${cs.length}</span></h3><p class="hint">${HINTS[S.pipe][s]}</p>
    ${cs.map(c=>{const dc=dueClass(c.nextDate);return `<button class="pcard" data-open="${esc(c.id)}"><span><span class="lv ${esc(c.level)}" style="margin-right:5px">${esc(c.level||'–')}</span>${esc(c.name)}${c.example?' <span class="tag t-ex">範例</span>':''}</span><span class="m">${esc(c.nextAction||'還沒排下一步')}</span>${c.nextDate?`<span class="due ${dc}" style="font-size:12px">${dueLabel(c.nextDate)}</span>`:''}</button>`}).join('')||'<span class="note" style="padding:4px">—</span>'}</div>`}).join('')}</div>`;
}

function dataHTML(){
  if(!S.contacts.length)return `<div class="card empty">新增名單並開始記錄跟進後，這裡會出現活動量、漏斗和轉換率。</div>`;
  const w=weekStats(),g=S.settings,md=monthDeals();
  const kpi=(l,v,goal)=>{const p=goal?Math.min(1,v/goal):0;return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${goal?`<div class="g">目標 <span class="num">${goal}</span></div><div class="meter"><i class="${p>=1?'done':''}" style="width:${p*100}%"></i></div>`:'<div class="g">電話、訊息、見面</div>'}</div>`};
  const R=rates(),T=Number(g.monthlyDeals)||0;
  const needMeet=Math.ceil(T/R.r3.v),needAppt=Math.ceil(needMeet/R.r2.v),needList=Math.ceil(needAppt/R.r1.v);
  const src=SOURCES.map(s=>{const l=S.contacts.filter(c=>c.source===s);return{s,n:l.length,cl:l.filter(c=>c.isClient).length,deal:l.filter(c=>c.clientStage==='成交').length,rec:l.filter(c=>c.recruitStage==='已報到'||c.recruitStage==='輔導期').length}}).filter(x=>x.n);
  return `<div class="stack">
  <section class="card">
    <div class="card-h"><h2>本週活動量</h2><button class="btn sm" data-act="goals">調整目標</button></div>
    <div class="kpis">${kpi('新增名單',w.newC,g.weeklyNew)}${kpi('約訪',w.appt,g.weeklyAppt)}${kpi('面談',w.meet,g.weeklyMeet)}${kpi('聯絡次數',w.touch)}</div>
    <p class="note" style="margin:10px 0 0">本月成交 <span class="num">${md.n}</span> 件 · 年繳保費 <span class="num">${md.prem.toLocaleString()}</span> 元 · 本週事業說明 <span class="num">${w.recruitTalk}</span> 場</p>
  </section>
  <section class="card">
    <div class="card-h"><h2>要達成目標，需要多少量？</h2><span class="sub">每月成交 <span class="num">${T}</span> 件</span></div>
    <div class="scroll"><table><thead><tr><th>需要的量</th><th class="r">每月</th><th class="r">每週</th><th>依據的轉換率</th></tr></thead><tbody>
      <tr><td>新名單</td><td class="r num">${needList}</td><td class="r num">${Math.ceil(needList/4.3)}</td><td class="note">名單→約訪 ${pct(R.r1.v)}${R.r1.real?'（你的實際數字）':'（預設值）'}</td></tr>
      <tr><td>約訪</td><td class="r num">${needAppt}</td><td class="r num">${Math.ceil(needAppt/4.3)}</td><td class="note">約訪→面談 ${pct(R.r2.v)}${R.r2.real?'（你的實際數字）':'（預設值）'}</td></tr>
      <tr><td>面談</td><td class="r num">${needMeet}</td><td class="r num">${Math.ceil(needMeet/4.3)}</td><td class="note">面談→成交 ${pct(R.r3.v)}${R.r3.real?'（你的實際數字）':'（預設值）'}</td></tr>
    </tbody></table></div>
    <p class="note" style="margin:8px 0 0">某階段累積滿 5 人後，會改用你自己的實際轉換率計算。</p>
  </section>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>客戶漏斗</h2><span class="sub num">${funnel('client').total} 人</span></div>${funnelHTML('client')}</section>
    <section class="card"><div class="card-h"><h2>增員漏斗</h2><span class="sub num">${funnel('recruit').total} 人</span></div>${funnelHTML('recruit')}</section>
  </div>
  <section class="card">
    <div class="card-h"><h2>哪種來源最有效</h2></div>
    <div class="scroll"><table><thead><tr><th>來源</th><th class="r">人數</th><th class="r">客戶</th><th class="r">成交</th><th class="r">成交率</th><th class="r">增員報到</th></tr></thead><tbody>
    ${src.map(x=>`<tr><td>${x.s}</td><td class="r num">${x.n}</td><td class="r num">${x.cl}</td><td class="r num">${x.deal}</td><td class="r num">${x.cl?pct(x.deal/x.cl):'—'}</td><td class="r num">${x.rec}</td></tr>`).join('')}
    </tbody></table></div>
  </section>
  <section class="card stack" style="gap:10px">
    <h2>資料備份與匯出</h2>
    ${S.mode==='local'?`<p class="note" style="margin:0">名單只存在這台裝置的瀏覽器，不會上傳到任何伺服器。清除瀏覽器資料或換手機前，請先下載備份。${lsGet(LS_KEY+'-backup')?`上次備份：${lsGet(LS_KEY+'-backup')}`:'還沒備份過。'}</p>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${S.mode==='local'?'<button class="btn" data-act="backup">下載備份</button><button class="btn" data-act="restore">從備份還原</button>':''}
      <button class="btn" data-act="export">匯出 Excel 用的 CSV</button>
    </div>
  </section>
  </div>`;
}
function funnelHTML(k){
  const f=funnel(k),max=Math.max(1,f.reached[0]);
  let h=`<div class="fun ${k==='recruit'?'r':''}">`;
  f.main.forEach((s,i)=>{
    h+=`<div class="fr"><span>${s}</span><span class="bar"><i style="width:${f.reached[i]/max*100}%"></i></span><span class="c num">${f.reached[i]}</span>`;
    if(i>0)h+=`<span class="cv">↳ 上一階段有 ${f.reached[i-1]?pct(f.reached[i]/f.reached[i-1]):'—'} 走到這裡</span>`;
    h+='</div>';
  });
  return h+`</div><p class="note" style="margin:8px 0 0">數字是「曾經走到這個階段」的人數。暫緩中：<span class="num">${f.paused}</span> 人</p>`;
}

/* ---------- sheets ---------- */
function openSheet(kind,id,returnTo){S.sheet=kind;S.openId=id||null;S.returnTo=returnTo||null;drawSheet();$('#sheet .panel')?.scrollTo(0,0)}
function closeSheet(){S.sheet=null;S.openId=null;S.returnTo=null;const s=$('#sheet');s.hidden=true;s.innerHTML=''}
function goBack(){if(S.returnTo==='detail'&&S.openId&&S.contacts.find(x=>x.id===S.openId))openSheet('detail',S.openId);else closeSheet()}
function refreshSheet(){if(S.sheet==='detail'&&!$('#sheet').contains(document.activeElement))drawSheet()}
function drawSheet(){
  const s=$('#sheet');if(!S.sheet){s.hidden=true;return}
  const c=S.openId?S.contacts.find(x=>x.id===S.openId):null;
  if((S.sheet==='detail'||S.sheet==='follow')&&!c){closeSheet();return}
  const h={detail:()=>detailHTML(c),edit:()=>formHTML(c),follow:()=>followHTML(c),goals:goalsHTML,confirm:confirmHTML,help:helpHTML}[S.sheet]();
  s.innerHTML=`<div class="panel" role="dialog" aria-modal="true">${h}</div>`;s.hidden=false;
}
function dateChips(target){return `<div class="chips">${DATE_CHIPS.map(([l,n])=>`<button type="button" class="chip" data-date-n="${n}" data-target="${target}">${l}</button>`).join('')}<button type="button" class="chip" data-date-n="" data-target="${target}">不排</button></div>`}
function trackHTML(c,k){
  const K=kindInfo(k),cur=c[K.field],main=K.stages.slice(0,-1),idx=main.indexOf(cur),nx=nextStageOf(c,k);
  return `<div class="track ${k==='recruit'?'r':''}">
    <div class="track-h"><span class="tag ${k==='client'?'t-c':'t-r'}">${K.label}流程</span><span>目前：<b>${cur}</b></span></div>
    ${cur==='暫緩'?'<p class="note" style="margin:0">暫緩中，先不列入跟進。</p>':`<ol class="dots">${main.map((s,i)=>`<li class="${i<idx?'past':i===idx?'now':''}">${s}</li>`).join('')}</ol>`}
    <div class="track-a">${nx?`<button class="btn sm pri" data-advance="${k}">${cur==='暫緩'?'恢復跟進':'推進到'}「${nx}」</button>`:`<span class="note">${k==='client'?'已成交，記得做售後服務並請他轉介紹。':'已進入輔導期，持續陪伴。'}</span>`}
    <select data-stage="${k}" aria-label="改成其他${K.label}階段"><option value="">改成其他階段…</option>${K.stages.filter(s=>s!==cur).map(s=>`<option>${s}</option>`).join('')}</select></div>
  </div>`;
}

    <div style="display:flex;gap:6px"><button class="btn sm" data-act="edit">編輯</button><button class="btn sm" data-act="close">關閉</button></div></div>
  <div class="stack">
    <div class="card stack" style="gap:10px">
      <div class="next-box"><span class="l">下一步${c.nextDate?` · <span class="due ${dc}">${dueLabel(c.nextDate)}</span>`:''}</span>
        <span>${esc(c.nextAction||'還沒排下一步')}</span></div>

      <div class="note">${lc?`上次聯絡：${daysBetween(lc,today())===0?'今天':daysBetween(lc,today())+' 天前'}（${short(lc)}）`:'還沒有聯絡紀錄'}</div>
      ${c.phone?`<div class="contact-line"><span class="sub">電話</span><span class="v">${esc(c.phone)}</span>${tel.length>=8?`<a class="btn sm" href="tel:${esc(tel)}">撥打</a>`:''}<button class="btn sm" data-copy="${esc(c.phone)}">複製</button></div>`:''}
      ${c.line?`<div class="contact-line"><span class="sub">LINE</span><span class="v">${esc(c.line)}</span><button class="btn sm" data-copy="${esc(c.line)}">複製</button></div>`:''}
    </div>
    <div class="card stack" style="gap:12px">

      ${c.contactOther?`<dt>其他聯絡</dt><dd>${esc(c.contactOther)}</dd>`:''}

    <div class="card"><div class="card-h"><h2>互動紀錄</h2><span class="sub num">${log.length} 筆</span></div>

function followHTML(c){
  const kinds=kindsOf(c).filter(k=>nextStageOf(c,k));
  const firstHint=kinds.length?HINTS[kinds[0]][c[kindInfo(kinds[0]).field]]:'';
  return `<div class="ph"><div><h2>記錄跟進</h2><div class="sub">${esc(c.name)}${c.nextAction?' · 原本要做：'+esc(c.nextAction):''}</div></div><button class="btn sm" data-act="back">取消</button></div>
  <form id="ff" class="stack" novalidate>
    <div class="f">這次怎麼聯絡的<div class="checks big" role="radiogroup">${LOG_TYPES.map((t,i)=>`<label><input type="radio" name="k" value="${t}" id="ff-k-${i}" ${i===0?'checked':''}>${t}</label>`).join('')}</div></div>
    <label class="f">聊了什麼（可以不填）<textarea id="ff-x" name="x" placeholder="例如：小孩明年上小學，想了解教育金"></textarea></label>
    ${kinds.length?`<div class="adv">${kinds.map(k=>{const K=kindInfo(k),nx=nextStageOf(c,k);return `<label class="sw"><input type="checkbox" name="adv" value="${k}" id="ff-adv-${k}" data-hint="${esc(HINTS[k][nx])}">${K.label}：從「${c[K.field]}」推進到「${nx}」</label>`}).join('')}</div>`:''}
    <label class="f">下一步要做什麼<input id="ff-na" name="na" value="" placeholder="${esc(firstHint||'例如：約喝咖啡')}" data-auto=""></label>

    </div>

    <div class="f">什麼時候<input id="f-nd" name="nd" type="date" value="${esc(c.nextDate)}">${dateChips('f-nd')}</div>

        <label class="f">年齡層<select id="f-age" name="age"><option value="">—</option>${opt(AGES,c.age)}</select></label>
        <label class="f">職業<input id="f-occupation" name="occupation" value="${esc(c.occupation)}"></label>
      </div>
      <label class="f">家庭狀況<input id="f-family" name="family" value="${esc(c.family)}" placeholder="例如：已婚、2 個小孩"></label>
      <div class="f">需求<div class="checks">${NEEDS.map((n,i)=>`<label><input type="checkbox" id="f-need-${i}" name="needs" value="${n}" ${c.needs.includes(n)?'checked':''}>${n}</label>`).join('')}</div></div>
      <label class="f">年繳保費（成交後填）<input id="f-premium" name="premium" type="number" inputmode="numeric" min="0" value="${esc(c.premium)}"></label>

      <p class="note" style="margin:0">請勿記錄身分證字號、病歷等敏感個資。</p>
    </div></details>
    <p class="err" id="ferr" hidden></p>
    <button class="btn pri big" type="submit">${isNew?'儲存':'儲存修改'}</button>
    ${isNew?'<button class="btn big" type="submit" data-again="1">儲存並繼續新增下一位</button>':''}

}
function goalsHTML(){const g=S.settings;
  return `<div class="ph"><h2>調整目標</h2><button class="btn sm" data-act="close">取消</button></div>
  <form id="gf" class="stack" novalidate><div class="fg">
  <label class="f">每週新增名單<input id="g-weeklyNew" name="weeklyNew" type="number" min="0" value="${g.weeklyNew}"></label>
  <label class="f">每週約訪<input id="g-weeklyAppt" name="weeklyAppt" type="number" min="0" value="${g.weeklyAppt}"></label>
  <label class="f">每週面談<input id="g-weeklyMeet" name="weeklyMeet" type="number" min="0" value="${g.weeklyMeet}"></label>
  <label class="f">每月成交件數<input id="g-monthlyDeals" name="monthlyDeals" type="number" min="0" value="${g.monthlyDeals}"></label>
  </div><p class="note" style="margin:0">「每月成交件數」會用來反推每週需要多少名單、約訪和面談。</p>
  <button class="btn pri big" type="submit">儲存目標</button></form>`}
function helpHTML(){
  return `<div class="ph"><h2>使用說明</h2><button class="btn sm" data-act="close">關閉</button></div>
  <div class="stack help">
    <section class="card stack" style="gap:6px"><h3>每天這樣用</h3><ol class="steps-ol">

    <section class="card stack" style="gap:6px"><h3>名詞解釋</h3><ul>
      <li><b>熟悉度 A/B/C</b>：A 很熟、常聯絡；B 認識但不常聯絡；C 不熟或很久沒聯絡。先從 A 開始約。</li>
      <li><b>影響力</b>：這個人的人脈廣不廣。影響力高的人，適合請他轉介紹或邀請增員。</li>
      <li><b>客戶流程</b>：未接觸 → 已約訪 → 已面談 → 需求分析 → 建議書 → 成交。</li>
      <li><b>增員流程</b>：未接觸 → 已接觸 → 事業說明 → 考照中 → 已報到 → 輔導期。</li>
      <li><b>暫緩</b>：對方暫時沒興趣，先不列入跟進，之後可以按「恢復跟進」。</li>

      <li><b>漏斗</b>：每個階段「曾經走到」的人數，越往下越少是正常的。</li>
      <li><b>轉換率</b>：上一階段的人，有幾成走到下一階段。例如約訪 10 人、面談 7 人，轉換率就是 70%。</li></ul></section>
    <section class="card stack" style="gap:6px"><h3>資料存在哪裡</h3><p>${S.mode==='local'?'名單只存在這台裝置的瀏覽器，不會上傳到任何地方，別人看不到。清除瀏覽器資料會讓名單消失，請到「數據」頁定期下載備份；換手機時，在新手機按「從備份還原」。':'名單存在這個頁面的雲端資料庫，只有你看得到。'}</p></section>
    <section class="card stack" style="gap:6px"><h3>個資提醒</h3><p>名單屬於個人資料，蒐集前請取得對方同意，也不要記錄身分證字號、病歷等敏感資料。</p></section>
  </div>`}
let confirmCtx=null;
function confirmHTML(){return `<div class="ph"><h2>${esc(confirmCtx.title)}</h2></div><p>${esc(confirmCtx.text)}</p>
  <div style="display:flex;gap:8px"><button class="btn danger" data-act="confirm-yes">${esc(confirmCtx.yes)}</button><button class="btn" data-act="confirm-no">取消</button></div>`}
function askConfirm(ctx){confirmCtx=ctx;const back=S.sheet==='detail'?'detail':null;openSheet('confirm',S.openId,back)}

/* ---------- actions ---------- */
function current(){const c=S.contacts.find(x=>x.id===S.openId);return c?normalize(clone(c)):null}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.v){if(t.dataset.v==='add'){openSheet('edit');return}S.view=t.dataset.v;closeSheet();render();window.scrollTo(0,0);return}
  if(t.dataset.open){openSheet('detail',t.dataset.open);return}
  if(t.dataset.follow){openSheet('follow',t.dataset.follow,S.sheet==='detail'?'detail':null);return}
  if(t.dataset.filter){S.filter=t.dataset.filter;renderResults();return}
  if(t.dataset.gotoFilter){S.filter=t.dataset.gotoFilter;S.view='list';render();window.scrollTo(0,0);return}
  if(t.dataset.pipe){S.pipe=t.dataset.pipe;render();return}
  if('dateN' in t.dataset){const inp=$('#'+t.dataset.target);inp.value=t.dataset.dateN===''?'':addDays(today(),Number(t.dataset.dateN));return}
  if(t.dataset.copy){copyText(t.dataset.copy);return}
  if(t.dataset.advance){const c=current(),k=t.dataset.advance,nx=nextStageOf(c,k);if(!nx)return;
    const old=c[kindInfo(k).field];setStage(c,k,nx);if(!c.nextAction||c.nextAction===HINTS[k][old])c.nextAction=HINTS[k][nx];
    await saveContact(c).catch(()=>{});toast(`已推進到「${nx}」`);drawSheet();return}
  const a=t.dataset.act;if(!a)return;
  if(a==='add')openSheet('edit');
  else if(a==='help')openSheet('help');
  else if(a==='onboarded'){lsSet(LS_KEY+'-onboarded','1');render()}
  else if(a==='close')closeSheet();
  else if(a==='back'||a==='confirm-no')goBack();
  else if(a==='edit')openSheet('edit',S.openId,'detail');
  else if(a==='goals')openSheet('goals');
  else if(a==='ask-del'){const c=S.contacts.find(x=>x.id===S.openId);askConfirm({title:`刪除「${c.name}」？`,text:'這位名單和所有互動紀錄都會被刪除，無法復原。',yes:'刪除',run:async()=>{await deleteContact(c.id);closeSheet();toast('已刪除')}})}
  else if(a==='clear-ex'){const n=S.contacts.filter(c=>c.example).length;askConfirm({title:'清除範例名單？',text:`會刪除 ${n} 筆標示「範例」的示範名單，你自己新增的名單不受影響。`,yes:'清除範例',run:async()=>{for(const c of S.contacts.filter(c=>c.example))await deleteContact(c.id);closeSheet();toast('範例已清除')}})}
  else if(a==='confirm-yes'){try{await confirmCtx.run()}catch(err){}}
  else if(a==='export')exportCSV();
  else if(a==='backup')backup();
  else if(a==='restore')$('#restore-file').click();
});
document.addEventListener('change',async e=>{
  const s=e.target.closest('select[data-stage]');
  if(s&&s.value){const c=current(),k=s.dataset.stage,val=s.value;setStage(c,k,val);await saveContact(c).catch(()=>{});document.activeElement?.blur();toast(`已改成「${val}」`);drawSheet();return}
  if(e.target.name==='adv'){const na=$('#ff-na'),checked=[...document.querySelectorAll('input[name="adv"]:checked')];
    if(!na.value||na.value===na.dataset.auto){const v=checked.length?checked[0].dataset.hint:'';na.value=v;na.dataset.auto=v}}
  if(e.target.id==='restore-file')restoreFrom(e.target);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderResults()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f);
  if(f.id==='gf'){['weeklyNew','weeklyAppt','weeklyMeet','monthlyDeals'].forEach(k=>S.settings[k]=Math.max(0,Number(fd.get(k))||0));closeSheet();await saveSettings();toast('目標已儲存');return}
  if(f.id==='ff'){
    const c=current();if(!c)return;
    const k=fd.get('k')||'電話',x=(fd.get('x')||'').trim();
    c.log.push({d:today(),k,x:x||`${k}聯絡`});
    const adv=fd.getAll('adv');adv.forEach(kind=>{const nx=nextStageOf(c,kind);if(nx)setStage(c,kind,nx)});
    c.nextAction=(fd.get('na')||'').trim();c.nextDate=fd.get('nd')||'';
    try{await saveContact(c)}catch(err){return}
    toast(adv.length?'已記錄，並推進階段':'已記錄跟進');goBack();return;
  }
  if(f.id!=='cf')return;
  const name=(fd.get('name')||'').trim();
  if(!name){const er=$('#ferr');er.textContent='請填寫姓名。';er.hidden=false;$('#f-name').focus();return}
  const prev=S.openId&&S.sheet==='edit'?current():null;
  const c=prev||{id:newId(),createdAt:new Date().toISOString(),clientStage:'未接觸',recruitStage:'未接觸',clientMax:0,recruitMax:0,log:[{d:today(),k:'建立',x:'加入名單'}],stageDates:{}};
  Object.assign(c,{name,isClient:fd.has('isClient'),isRecruit:fd.has('isRecruit'),level:fd.get('level')||'B',
    phone:(fd.get('phone')||'').trim(),line:(fd.get('line')||'').trim(),nextAction:(fd.get('na')||'').trim(),nextDate:fd.get('nd')||'',
    relation:fd.get('relation'),source:fd.get('source'),referrer:(fd.get('referrer')||'').trim(),influence:Number(fd.get('influence'))||2,age:fd.get('age'),
    occupation:(fd.get('occupation')||'').trim(),family:(fd.get('family')||'').trim(),needs:fd.getAll('needs'),
    premium:fd.get('premium')?Number(fd.get('premium')):'',notes:(fd.get('notes')||'').trim(),consent:fd.has('consent')});
  normalize(c);
  try{await saveContact(c)}catch(err){return}
  if(e.submitter?.dataset.again){toast(`已新增 ${name}，繼續輸入下一位`);openSheet('edit');$('#f-name')?.focus();return}
  toast(prev?'已儲存':`已新增 ${name}`);openSheet('detail',c.id);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('已複製')}catch(e){toast('無法自動複製，請長按文字複製')}}

/* ---------- files ---------- */
async function saveFile(name,text,type){
  if(S.dl){try{await S.dl.save({filename:name,data:text});return true}catch(err){if(err?.code!=='declined')toast('下載失敗');return false}}
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);return true;
}
async function exportCSV(){
  const cols=[['姓名','name'],['客戶對象',c=>c.isClient?'是':''],['增員對象',c=>c.isRecruit?'是':''],['客戶階段','clientStage'],['增員階段','recruitStage'],['熟悉度','level'],['電話','phone'],['LINE','line'],['關係','relation'],['來源','source'],['介紹人','referrer'],['年齡層','age'],['職業','occupation'],['家庭','family'],['需求',c=>(c.needs||[]).join('、')],['年繳保費','premium'],['下一步','nextAction'],['下一步日期','nextDate'],['上次聯絡',lastContact],['個資同意',c=>c.consent?'是':'否'],['備註','notes'],['建立日期',c=>(c.createdAt||'').slice(0,10)]];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='﻿'+[cols.map(c=>q(c[0])).join(',')].concat(S.contacts.map(c=>cols.map(([,k])=>q(typeof k==='function'?k(c):c[k])).join(','))).join('\r\n');
  if(await saveFile(`prospects-${today()}.csv`,csv,'text/csv;charset=utf-8'))toast('已匯出 CSV');
}
async function backup(){
  const ok=await saveFile(`prospects-backup-${today()}.json`,JSON.stringify({app:'prospect-system',version:2,exportedAt:new Date().toISOString(),contacts:S.contacts,settings:S.settings},null,2),'application/json');
  if(ok){lsSet(LS_KEY+'-backup',today());toast('已下載備份');render()}
}
function restoreFrom(input){
  const file=input.files[0];input.value='';if(!file)return;
  const r=new FileReader();
  r.onload=()=>{let data;try{data=JSON.parse(r.result)}catch(err){toast('這個檔案不是有效的備份檔');return}
    if(!data||!Array.isArray(data.contacts)){toast('這個檔案不是名單備份檔');return}
    askConfirm({title:'從備份還原？',text:`會用備份裡的 ${data.contacts.length} 位名單，取代目前的 ${S.contacts.length} 位名單。建議先下載一份目前的備份。`,yes:'還原',run:async()=>{
      S.contacts=data.contacts.filter(c=>c&&c.id&&c.name).map(normalize);if(data.settings)Object.assign(S.settings,data.settings);lsSave();closeSheet();render();toast('已還原備份')}});
  };
  r.readAsText(file);
}

/* ---------- boot ---------- */
function startLocal(){
  S.mode='local';lsLoad();
  if(!lsGet(LS_KEY+'-seeded')){if(!S.contacts.length){S.contacts=sampleContacts();lsSave()}lsSet(LS_KEY+'-seeded','1')}
  S.status='ready';render();
}
(async()=>{
  if(!window.claude?.use){startLocal();return}
  const use=n=>window.claude.use(n).catch(()=>null);
  use('downloads').then(d=>S.dl=d);
  const db=await use('db');
  if(!db){startLocal();return}
  S.mode='db';S.db=db;render();
  const timer=setTimeout(()=>{if(S.status==='loading'){S.status='slow';render()}},10000);
  db.collection('contacts').onSnapshot(snap=>{
    S.contacts=snap.docs.map(d=>normalize(Object.assign({id:d.id},clone(d.data()))));
    if(!snap.metadata.fromCache){clearTimeout(timer);S.status='ready'}else if(S.status==='loading')S.status='ready';
    render();
  },()=>{clearTimeout(timer);S.status='error';render()});
  db.doc('settings/goals').onSnapshot(s=>{if(s.exists){Object.assign(S.settings,s.data());render()}},()=>{});
})();
